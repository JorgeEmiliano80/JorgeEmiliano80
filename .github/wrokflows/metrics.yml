name: GitHub Metrics
on:
  # Schedule: Actualización diaria a las 00:00 UTC
  schedule: [{cron: "0 0 * * *"}]
  # Permite ejecución manual para pruebas
  workflow_dispatch:
  # Se ejecuta al hacer push a la rama principal
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: General Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: JorgeEmiliano80
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles

          plugin_languages: yes
          plugin_languages_ignored: html, css, tex
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          
          plugin_lines: yes
          
          filename: github-metrics.svg
