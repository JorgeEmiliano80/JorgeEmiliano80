name: GitHub Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Focused Engineering Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: JorgeEmiliano80
          template: classic
          config_theme: tokyonight
          config_timezone: America/Los_Angeles
          base: "" 
          
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, scss
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: push, pull_request, issue

          plugin_lines: yes
          
          filename: github-metrics.svg
