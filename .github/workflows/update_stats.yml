name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: s

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generar la tarjeta de estadísticas generales
      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=JorgeEmiliano80&show_icons=true&theme=tokyonight&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      # Generar la tarjeta de los lenguajes que más usas
      - name: Generate Language Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=JorgeEmiliano80&layout=compact&theme=tokyonight&hide_border=true
          path: profile/langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      # Hacer el commit de las imágenes directamente en tu repositorio
      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub stats SVGs" || exit 0
          git push
