# This workflow automates the generation of technical metrics to avoid external dependencies.
name: GitHub Metrics

on:
  # Schedule: Update daily at midnight
  schedule: [{cron: "0 0 * * *"}]
  # Manual trigger for immediate verification
  workflow_dispatch:
  # Trigger on push to the main branch
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Engineering Metrics Generation
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: JorgeEmiliano80
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles
          
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          
          plugin_lines: yes
          
          filename: github-metrics.svg
